<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireLens · Check your resume against a job</title>
    <meta name="description" content="Upload your resume and paste a job posting to get an honest match score, the skills you show and miss, and the changes that matter. Files are never stored." />
    <meta name="theme-color" content="#2A2420" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply a saved light/dark choice before the first paint to avoid a flash.
      try {
        var t = localStorage.getItem('hirelens:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
